<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | sammy.com</title><link rel="stylesheet" href="sammy-business.css"></head><body><div class="announcement">Secure order request / sammy.com</div><header class="header"><div class="container nav"><a class="brand" href="sammy-business.html">sammy<span>.</span>com</a><a class="under-link" href="sammy-business.html#shop">← Continue shopping</a></div></header><main class="checkout-page"><div class="container checkout-grid"><section><p class="eyebrow">01 / Your details</p><h1>Make it<br><em>yours.</em></h1><form id="checkoutForm"><label for="customer">Full name</label><input id="customer" required placeholder="Your name"><label for="phone">Phone / WhatsApp</label><input id="phone" required placeholder="0800 000 0000"><label for="address">Delivery address</label><textarea id="address" required rows="4" placeholder="Where should we deliver?"></textarea><button class="button dark" type="submit">Place order request <span>↗</span></button><p id="checkoutStatus" role="status"></p></form></section><aside class="order-summary"><p class="eyebrow">02 / Summary</p><h2>Your order</h2><div id="orderItems"></div><div class="summary-total"><span>Total</span><strong id="orderTotal">N0</strong></div><p class="summary-note">Your order will be recorded and we will confirm availability and payment instructions with you directly.</p></aside></div></main><script>const item=JSON.parse(localStorage.getItem('sammyPendingItem')||'null');const items=item?[item]:[];const money=n=>`N${Number(n).toLocaleString('en-NG')}`;document.querySelector('#orderItems').innerHTML=items.length?items.map(x=>`<div class="summary-item"><span>${x.name}<small>${x.size}</small></span><b>${money(x.price)}</b></div>`).join(''):'<p class="empty-cart">Your bag is empty. Return to the collection.</p>';document.querySelector('#orderTotal').textContent=money(items.reduce((s,x)=>s+x.price,0));document.querySelector('#checkoutForm').addEventListener('submit',async e=>{e.preventDefault();if(!items.length){document.querySelector('#checkoutStatus').textContent='Add a piece before checking out.';return;}const payload={customer:document.querySelector('#customer').value,phone:document.querySelector('#phone').value,address:document.querySelector('#address').value,items,total:items.reduce((s,x)=>s+x.price,0)};try{const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw new Error();const result=await response.json();document.querySelector('#checkoutStatus').innerHTML=`Order <strong>${result.order.id}</strong> received. <a href="https://wa.me/2349114362935?text=Hi%20sammy.com%2C%20my%20order%20${result.order.id}%20has%20been%20submitted." target="_blank">Continue on WhatsApp ↗</a>`;localStorage.removeItem('sammyPendingItem');}catch(error){document.querySelector('#checkoutStatus').textContent='Start the server to submit an order, or contact us on WhatsApp.';}});</script></body></html>
