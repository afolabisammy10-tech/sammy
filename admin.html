<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio admin | sammy.com</title><link rel="stylesheet" href="sammy-business.css"></head><body class="admin-page"><header class="header"><div class="container nav"><a class="brand" href="sammy-business.html">sammy<span>.</span>com</a><span class="admin-label">STUDIO ADMIN / PRIVATE</span><a class="under-link" href="sammy-business.html">View storefront ↗</a></div></header><main class="admin-main"><div class="container"><div class="admin-head"><div><p class="eyebrow">Operations</p><h1>Good morning,<br><em>studio.</em></h1></div><button class="button dark" id="refresh">Refresh data ↻</button></div><div class="stats"><div><span>Products</span><strong id="productCount">—</strong></div><div><span>Orders</span><strong id="orderCount">—</strong></div><div><span>Revenue requested</span><strong id="revenue">—</strong></div></div><section class="admin-table"><div class="table-head"><h2>Recent orders</h2><span id="status">Connecting...</span></div><div id="orders"><p class="empty-cart">Loading orders...</p></div></section></div></main><script>const money=n=>`N${Number(n).toLocaleString('en-NG')}`;const statuses=['awaiting-payment','processing','shipped','out-for-delivery','delivered'];const label=s=>s.replaceAll('-',' ');async function updateStatus(id,status){const response=await fetch(`/api/orders/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!response.ok)throw new Error();document.querySelector('#status').textContent=`${id} updated`;load();}async function load(){try{const [products,orders]=await Promise.all([fetch('/api/products').then(r=>r.json()),fetch('/api/orders').then(r=>r.json())]);document.querySelector('#productCount').textContent=products.length;document.querySelector('#orderCount').textContent=orders.length;document.querySelector('#revenue').textContent=money(orders.reduce((s,o)=>s+o.total,0));document.querySelector('#status').textContent='Live data';document.querySelector('#orders').innerHTML=orders.length?orders.slice().reverse().map(o=>`<div class="order-row"><div><strong>${o.id}</strong><span>${o.customer} · ${o.phone}</span></div><b>${money(o.total)}</b><select data-order="${o.id}" aria-label="Update ${o.id} status">${statuses.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${label(s)}</option>`).join('')}</select></div>`).join(''):'<p class="empty-cart">No orders yet. New requests will appear here.</p>';document.querySelectorAll('[data-order]').forEach(select=>select.addEventListener('change',()=>updateStatus(select.dataset.order,select.value).catch(()=>{document.querySelector('#status').textContent='Could not update status';})));}catch(error){document.querySelector('#status').textContent='Server offline';document.querySelector('#orders').innerHTML='<p class="empty-cart">Start the Python or Express server to manage order statuses.</p>';}}document.querySelector('#refresh').onclick=load;load();</script></body></html>
